name: Video Workbench Delivery Gate

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "docs/ops-video-workflow-storage-lifecycle.md"
      - ".github/workflows/video-workbench-delivery.yml"
  push:
    branches:
      - main
      - "feat/google-flow-core-video-workbench"

permissions:
  contents: read

concurrency:
  group: video-workbench-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API contract and concurrency tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install API dependencies
        run: python -m pip install -r apps/api/requirements.txt
      - name: Run video workflow API tests
        run: python -m pytest apps/api/tests/test_video_workflow_canvas.py apps/api/tests/test_api_contract_gate.py -q
      - name: Run API startup smoke
        run: python apps/api/scripts/ci_startup_smoke.py

  web:
    name: Web contracts, typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile
      - name: Run frontend contract tests
        working-directory: apps/web
        run: |
          bun src/lib/video-workbench-ci-contract.test.ts
          bun src/lib/video-workbench-staging-smoke-contract.test.ts
          bun src/lib/video-workflow-contract.test.ts
          bun src/lib/video-workflow-utils.test.ts
          bun src/lib/video-workflow-polling-controller.test.ts
          bun src/lib/api-proxy-contract.test.ts
      - name: TypeScript
        working-directory: apps/web
        run: bunx tsc --noEmit --incremental false
      - name: ESLint
        working-directory: apps/web
        run: bun run lint
      - name: Production build
        working-directory: apps/web
        run: bun run build

  e2e:
    name: Playwright formal video workbench entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium
      - name: Run video workbench E2E
        working-directory: apps/web
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: bun run test:e2e -- e2e/video-workbench.spec.ts --workers=1

  security:
    name: Secret and dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile
      - name: Client secret scan
        working-directory: apps/web
        run: bun run scan:client-secrets
      - name: Repository secret pattern scan
        shell: bash
        run: |
          key_prefix='sk-'
          google_prefix='AI''za'
          bearer_pattern='Authorization: Bearer [A-Za-z0-9._-]{20,}'
          pattern="(${key_prefix}[A-Za-z0-9_-]{20,}|${bearer_pattern}|${google_prefix}[0-9A-Za-z_-]{20,})"
          ! git grep -n -E "$pattern" -- \
            ':!apps/web/node_modules' \
            ':!apps/api/__pycache__'
      - name: Dependency audit
        working-directory: apps/web
        run: bun audit --audit-level critical
