<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShanHaiEdu 工作台 v3</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ══ TOKENS ═══════════════════════════════════════════════════════
   颜色仅三类：
   ① 主色  --blue   蓝色强调
   ② 文字  --tx1/2/3  灰阶文字层次
   ③ 背景  --bg/bg2/bg3  深色层次
   状态色：--ok / --warn / --err（绿/黄/红），仅用于状态标记
═══════════════════════════════════════════════════════════════════ */
:root {
  /* layout */
  --sw: 232px;
  --th: 56px;
  --r:  12px;

  /* background layers */
  --bg:   #0A0F1E;
  --bg2:  #0F1627;
  --bg3:  #172036;

  /* primary */
  --blue:     #4F72F5;
  --blue-dim: rgba(79,114,245,0.14);
  --blue-glow:rgba(79,114,245,0.30);

  /* text */
  --tx1: #E8EEFF;
  --tx2: #7A8EAD;
  --tx3: #3A4E6A;

  /* borders / cards */
  --line:  rgba(255,255,255,0.06);
  --card:  rgba(255,255,255,0.03);
  --card2: rgba(255,255,255,0.06);

  /* status (only for badges/dots) */
  --ok:   #22C55E;
  --warn: #EAB308;
  --err:  #EF4444;
}

/* light theme overrides */
body.light {
  --bg:   #F4F6FB;
  --bg2:  #FFFFFF;
  --bg3:  #EBF0FA;
  --blue:     #3B5EF0;
  --blue-dim: rgba(59,94,240,0.10);
  --blue-glow:rgba(59,94,240,0.22);
  --tx1: #0D1526;
  --tx2: #4A5E7A;
  --tx3: #9AAABF;
  --line:  rgba(0,0,0,0.07);
  --card:  rgba(0,0,0,0.025);
  --card2: rgba(0,0,0,0.055);
  --ok:   #16A34A;
  --warn: #CA8A04;
  --err:  #DC2626;
}

/* indigo theme overrides */
body.indigo {
  --bg:   #0B0C1E;
  --bg2:  #10112A;
  --bg3:  #181A38;
  --blue:     #7C86FA;
  --blue-dim: rgba(124,134,250,0.14);
  --blue-glow:rgba(124,134,250,0.28);
  --tx1: #E4E7FF;
  --tx2: #7880C0;
  --tx3: #353860;
  --line:  rgba(255,255,255,0.07);
  --card:  rgba(255,255,255,0.03);
  --card2: rgba(255,255,255,0.07);
}

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--tx1);
  min-height: 100vh;
  display: flex;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

/* ══ SIDEBAR ══════════════════════════════════════════════════════ */
.sidebar {
  width: var(--sw);
  background: var(--bg2);
  border-right: 1px solid var(--line);
  position: fixed; top:0; left:0; bottom:0;
  display: flex; flex-direction: column;
  z-index: 300;
}

.brand-area {
  padding: 20px 18px 16px;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px;
}

.brand-logo {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--blue);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 800; color: #fff;
  flex-shrink: 0;
  box-shadow: 0 4px 16px var(--blue-glow);
}

.brand-name { font-size: 14px; font-weight: 700; color: var(--tx1); letter-spacing: -.3px; }
.brand-sub  { font-size: 10.5px; color: var(--tx3); margin-top: 1px; }

/* role pill */
.role-row {
  padding: 10px 14px 0;
  display: flex; gap: 4px;
}
.role-btn {
  flex:1; text-align:center;
  padding: 5px 0; font-size: 11.5px; font-weight: 600;
  border-radius: 7px; cursor: pointer;
  color: var(--tx3); transition: all .18s; user-select: none;
}
.role-btn.on { background: var(--blue); color: #fff; box-shadow: 0 2px 10px var(--blue-glow); }

/* nav */
.nav-block { padding: 14px 10px 4px; }
.nav-sec-label {
  font-size: 9px; font-weight: 700; letter-spacing: 1.2px;
  text-transform: uppercase; color: var(--tx3);
  padding: 0 8px; margin-bottom: 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px; border-radius: 8px;
  cursor: pointer; font-size: 13px; font-weight: 500;
  color: var(--tx2); transition: all .14s;
  margin-bottom: 1px; position: relative;
}
.nav-item:hover { background: var(--card2); color: var(--tx1); }
.nav-item.on {
  background: var(--blue-dim); color: var(--blue);
}
.nav-item.on::before {
  content: ''; position: absolute; left:0; top:7px; bottom:7px;
  width: 3px; border-radius: 2px; background: var(--blue);
}
.nav-icon { font-size: 14px; width: 18px; text-align: center; flex-shrink:0; }
.nav-badge {
  margin-left: auto; font-size: 9.5px; font-weight: 700;
  padding: 1px 6px; border-radius: 20px;
  background: var(--warn); color: #000;
}

/* steps list */
.steps-scroll { flex:1; overflow-y:auto; padding: 4px 10px; }
.step-row {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: 8px; cursor: pointer;
  margin-bottom: 1px; transition: background .14s;
}
.step-row:hover { background: var(--card2); }
.step-row.on    { background: var(--blue-dim); }
.step-node {
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10.5px; font-weight: 700; flex-shrink: 0;
}
.sn-done   { background: rgba(34,197,94,.14); color: var(--ok); }
.sn-active { background: var(--blue); color: #fff; box-shadow: 0 0 0 3px var(--blue-dim); }
.sn-run    { background: rgba(234,179,8,.14); color: var(--warn); animation: pulse 2s infinite; }
.sn-idle   { background: var(--card2); color: var(--tx3); border: 1px solid var(--line); }
@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(234,179,8,.25); }
  50%      { box-shadow: 0 0 0 5px rgba(234,179,8,0); }
}
.s-name { font-size: 12px; font-weight: 500; color: var(--tx2); }
.s-hint { font-size: 10px; color: var(--tx3); margin-top: 1px; }
.step-row.on .s-name { color: var(--blue); }

/* sidebar foot */
.side-foot {
  padding: 10px;
  border-top: 1px solid var(--line);
}
.user-row {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 10px; border-radius: 9px;
  background: var(--card); cursor: pointer;
  transition: background .14s;
}
.user-row:hover { background: var(--card2); }
.avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--blue); display: flex; align-items: center;
  justify-content: center; font-size: 12px; font-weight: 700;
  color: #fff; flex-shrink:0;
}
.u-name { font-size: 12px; font-weight: 600; color: var(--tx1); }
.u-role { font-size: 10px; color: var(--blue); margin-top:1px; }

/* ══ MAIN ═════════════════════════════════════════════════════════ */
.main { margin-left: var(--sw); flex:1; display:flex; flex-direction:column; min-height:100vh; }

/* topbar */
.topbar {
  height: var(--th);
  background: var(--bg2);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center;
  padding: 0 32px; gap: 14px;
  position: sticky; top:0; z-index:200;
}
.bc { display:flex; align-items:center; gap:6px; font-size:13px; color: var(--tx2); }
.bc-sep  { color: var(--tx3); }
.bc-curr { color: var(--tx1); font-weight: 600; }
.spacer  { flex:1; }

.sys-pills { display:flex; gap:6px; }
.pill {
  display:flex; align-items:center; gap:5px;
  padding: 4px 10px; border-radius: 20px;
  background: var(--card); border: 1px solid var(--line);
  font-size: 11px; color: var(--tx2);
}
.dot { width:5px; height:5px; border-radius:50%; flex-shrink:0; }
.d-ok   { background: var(--ok);   box-shadow: 0 0 5px var(--ok); }
.d-blue { background: var(--blue); }
.d-warn { background: var(--warn); }

/* theme switcher */
.theme-sw {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 8px; border-radius: 20px;
  background: var(--card); border: 1px solid var(--line);
}
.th-label { font-size: 10px; font-weight: 600; color: var(--tx3); }
.th-dot {
  width: 16px; height: 16px; border-radius: 50%;
  cursor: pointer; transition: transform .15s;
  position: relative;
}
.th-dot:hover { transform: scale(1.25); }
.th-dot.on { box-shadow: 0 0 0 2px var(--bg2), 0 0 0 3.5px var(--blue); }
.th-dark   { background: #0A0F1E; border: 1px solid rgba(255,255,255,.2); }
.th-light  { background: #F4F6FB; border: 1px solid rgba(0,0,0,.15); }
.th-indigo { background: linear-gradient(135deg,#0B0C1E,#7C86FA); }

.btn {
  padding: 7px 16px; border-radius: 8px;
  font-size: 12.5px; font-weight: 600;
  cursor: pointer; border: none; font-family: inherit;
  transition: all .14s;
}
.btn-ghost   { background: var(--card2); color: var(--tx2); border: 1px solid var(--line); }
.btn-ghost:hover { color: var(--tx1); background: var(--card2); filter: brightness(1.3); }
.btn-primary { background: var(--blue); color: #fff; box-shadow: 0 3px 12px var(--blue-glow); }
.btn-primary:hover { filter: brightness(1.12); }

/* ══ CONTENT ══════════════════════════════════════════════════════ */
.content { flex:1; overflow-y:auto; padding: 32px 36px; }

/* hero */
.hero {
  background: linear-gradient(125deg, var(--bg3) 0%, var(--bg2) 100%);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 36px 40px;
  margin-bottom: 28px;
  position: relative; overflow: hidden;
}
.hero::after {
  content: ''; position: absolute; right:-60px; top:-60px;
  width: 260px; height: 260px;
  background: radial-gradient(circle, var(--blue-dim) 0%, transparent 70%);
  pointer-events: none;
}
.hero-tag {
  font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px;
  text-transform: uppercase; color: var(--blue); margin-bottom: 10px;
}
.hero-title {
  font-size: 28px; font-weight: 800; color: var(--tx1);
  letter-spacing: -.8px; line-height: 1.2; margin-bottom: 8px;
}
.hero-sub {
  font-size: 13.5px; color: var(--tx2); line-height: 1.7;
  max-width: 500px; margin-bottom: 24px;
}
.hero-meta { display: flex; align-items: center; gap: 22px; }
.hstat { }
.hstat-v {
  font-size: 28px; font-weight: 800; color: var(--tx1);
  letter-spacing: -1px; line-height: 1;
}
.hstat-l { font-size: 10.5px; color: var(--tx3); margin-top: 3px; }
.hdiv    { width:1px; height:32px; background: var(--line); }
.hero-actions { margin-left: auto; display:flex; gap:8px; }

/* stat grid */
.stat-grid {
  display: grid; grid-template-columns: repeat(4,1fr);
  gap: 14px; margin-bottom: 24px;
}
.scard {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r); padding: 22px 24px;
  position: relative; overflow: hidden;
  transition: border-color .18s;
}
.scard:hover { border-color: var(--line); filter: brightness(1.08); }
.scard::before {
  content: ''; position: absolute;
  top:0; left:0; right:0; height:2px;
  border-radius: var(--r) var(--r) 0 0;
}
.sc-blue::before   { background: var(--blue); }
.sc-ok::before     { background: var(--ok); }
.sc-warn::before   { background: var(--warn); }
.sc-err::before    { background: var(--err); }
.sc-icon { font-size: 18px; margin-bottom: 12px; }
.sc-val  { font-size: 34px; font-weight: 800; color: var(--tx1); letter-spacing: -1.5px; line-height:1; margin-bottom: 4px; }
.sc-lbl  { font-size: 11.5px; color: var(--tx2); }
.sc-delta {
  position: absolute; top:20px; right:20px;
  font-size: 10.5px; font-weight: 600;
  padding: 2px 7px; border-radius: 5px;
}
.d-up   { background: rgba(34,197,94,.12); color: var(--ok); }
.d-warn { background: rgba(234,179,8,.12);  color: var(--warn); }

/* section head */
.sec-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.sec-title { font-size: 15px; font-weight: 700; color: var(--tx1); }
.sec-link  { font-size: 12px; color: var(--blue); cursor: pointer; font-weight: 500; }
.sec-link:hover { text-decoration: underline; }

/* two col */
.two-col { display: grid; grid-template-columns: 1fr 360px; gap: 18px; margin-bottom: 24px; }

/* table card */
.tcard {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r); overflow: hidden;
}
.tc-head {
  display: grid; padding: 11px 18px;
  border-bottom: 1px solid var(--line);
  font-size: 10.5px; font-weight: 700;
  color: var(--tx3); text-transform: uppercase; letter-spacing: .5px;
}
.tc-row {
  display: grid; padding: 13px 18px;
  border-bottom: 1px solid var(--line);
  align-items: center; font-size: 13px; color: var(--tx2);
  transition: background .1s; cursor: pointer;
}
.tc-row:last-child { border-bottom: none; }
.tc-row:hover { background: var(--card2); }

/* status badge */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border-radius: 20px;
  font-size: 10.5px; font-weight: 600;
}
.b-ok   { background: rgba(34,197,94,.12); color: var(--ok); }
.b-run  { background: rgba(234,179,8,.12);  color: var(--warn); }
.b-idle { background: rgba(100,116,139,.10); color: var(--tx3); }
.b-err  { background: rgba(239,68,68,.12);  color: var(--err); }
.bdot   { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
.blink  { animation: blink 1.4s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

/* queue panel */
.qpanel {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r); overflow: hidden;
}
.qp-head {
  padding: 16px 18px; border-bottom: 1px solid var(--line);
  font-size: 13px; font-weight: 700; color: var(--tx1);
  display: flex; align-items: center; justify-content: space-between;
}
.qcount {
  background: var(--blue); color: #fff;
  font-size: 10px; font-weight: 700;
  padding: 1px 6px; border-radius: 10px;
}
.qi { padding: 13px 18px; border-bottom: 1px solid var(--line); }
.qi:last-child { border-bottom: none; }
.qi-top { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
.qi-name { font-size: 12.5px; font-weight: 500; color: var(--tx1); flex:1; }
.qi-track { height: 2px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
.qi-fill  { height: 100%; border-radius: 2px; transition: width .4s; }
.qi-fill-blue { background: var(--blue); }
.qi-fill-warn { background: var(--warn); }
.qi-fill-ok   { background: var(--ok); }
.qi-meta { display:flex; justify-content:space-between; margin-top:5px; font-size:10px; color:var(--tx3); }

/* log card */
.logcard {
  background: var(--bg); border: 1px solid var(--line);
  border-radius: var(--r); overflow: hidden; margin-bottom: 18px;
}
.log-head {
  padding: 13px 18px; border-bottom: 1px solid var(--line);
  font-size: 13px; font-weight: 700; color: var(--tx1);
  display: flex; align-items: center; gap: 8px;
}
.live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ok); box-shadow: 0 0 6px var(--ok);
  animation: blink 2s infinite;
}
.log-body {
  padding: 14px 18px;
  font-family: 'SF Mono','Fira Code',monospace;
  font-size: 11.5px; line-height: 1.9;
  max-height: 180px; overflow-y: auto;
}
.ll { display:flex; gap:12px; }
.lt { color: var(--tx3); flex-shrink:0; }
.lk { color: var(--ok); }
.lr { color: var(--warn); }
.li { color: var(--tx2); }
.le { color: var(--err); }

/* ══ TEACHER ══════════════════════════════════════════════════════ */
.step-hero {
  background: linear-gradient(125deg, var(--bg3), var(--bg2));
  border: 1px solid var(--line);
  border-radius: 16px; padding: 36px 42px;
  margin-bottom: 24px;
  position: relative; overflow: hidden;
}
.step-hero::after {
  content: ''; position: absolute; right:-70px; top:-70px;
  width: 280px; height: 280px;
  background: radial-gradient(circle, var(--blue-dim) 0%, transparent 65%);
  pointer-events: none;
}
.step-tag   { font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--blue); margin-bottom: 10px; }
.step-title { font-size: 30px; font-weight: 800; color: var(--tx1); letter-spacing: -1px; line-height: 1.15; margin-bottom: 8px; }
.step-desc  { font-size: 13.5px; color: var(--tx2); line-height: 1.7; max-width: 540px; }
.prog-row   { display:flex; align-items:center; gap:6px; margin-top:22px; }
.prog-seg   { flex:1; height:3px; border-radius:2px; background: var(--bg); transition: all .3s; }
.prog-seg.done   { background: var(--ok); }
.prog-seg.active { background: var(--blue); }
.prog-seg.run    { background: var(--warn); }

/* main card */
.mcard {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r); overflow: hidden; margin-bottom: 18px;
}
.mc-head {
  padding: 18px 26px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
}
.mc-title { font-size: 14px; font-weight: 700; color: var(--tx1); }
.mc-body  { padding: 24px 26px; }

/* form */
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.form-row  { display:flex; flex-direction:column; gap:5px; }
.form-full { grid-column: 1 / -1; }
.f-lbl { font-size: 10.5px; font-weight: 700; color: var(--tx3); text-transform: uppercase; letter-spacing: .5px; }
.f-in, .f-sel, .f-ta {
  width:100%; padding: 10px 13px;
  background: var(--bg2); border: 1px solid var(--line);
  border-radius: 8px; color: var(--tx1);
  font-size: 13.5px; font-family: inherit;
  outline: none; transition: border-color .18s;
}
.f-in:focus, .f-ta:focus { border-color: var(--blue); }
.f-ta { resize: vertical; min-height: 88px; line-height: 1.7; }
.f-sel { cursor: pointer; appearance: none; }

/* outline list */
.ol-item {
  display: flex; align-items: flex-start; gap: 13px;
  padding: 14px 0; border-bottom: 1px solid var(--line);
}
.ol-item:last-child { border-bottom: none; }
.ol-num {
  width: 28px; height: 28px; border-radius: 7px;
  background: var(--blue-dim); color: var(--blue);
  font-size: 11.5px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 1px;
}
.ol-main { font-size: 13.5px; font-weight: 600; color: var(--tx1); }
.ol-sub  { font-size: 12px; color: var(--tx2); margin-top: 3px; line-height: 1.6; }

/* slide preview */
.slide-canvas {
  background: linear-gradient(135deg, var(--bg3), var(--bg2));
  border: 1px solid var(--blue-dim);
  border-radius: 10px; padding: 36px 42px;
  min-height: 210px;
  display: flex; flex-direction: column; justify-content: center;
  position: relative; overflow: hidden;
}
.slide-num   { font-size: 10px; font-weight: 700; color: var(--blue); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
.slide-title { font-size: 20px; font-weight: 800; color: var(--tx1); letter-spacing: -.4px; margin-bottom: 14px; }
.slide-body  { font-size: 14px; color: var(--tx2); line-height: 1.9; }
.slide-math  { margin-top: 18px; font-size: 28px; font-weight: 800; color: var(--blue); letter-spacing: -1px; }

/* tab bar */
.tab-bar { display:flex; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.tab { padding: 9px 16px; font-size: 13px; font-weight: 500; color: var(--tx3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .14s; }
.tab:hover:not(.on) { color: var(--tx2); }
.tab.on { color: var(--blue); border-bottom-color: var(--blue); }

/* action bar */
.act-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 26px; border-top: 1px solid var(--line);
}
.act-note { font-size: 11.5px; color: var(--tx3); margin-left: auto; }

/* locked */
.locked { display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 72px 40px; text-align:center; }
.lock-icon  { font-size: 42px; margin-bottom: 18px; opacity: .35; }
.lock-title { font-size: 17px; font-weight: 700; color: var(--tx1); margin-bottom: 6px; }
.lock-desc  { font-size: 13.5px; color: var(--tx2); line-height: 1.7; max-width: 340px; }

/* misc */

    '--bg':'#F4F6FB','--bg2':'#FFFFFF','--bg3':'#EBF0FA',

    '--line':'rgba(255,255,255,0.07)','--card':'rgba(255,255,255,0.03)','--card2':'rgba(255,255,255,0.07)',
    '--ok':'#34D399','--warn':'#FBBF24','--err':'#F87171',
  },
};

let curTheme = localStorage.getItem('she-theme') || 'dark';

function applyTheme(t) {
  const v = THEMES[t]; if (!v) return;
  const r = document.documentElement;
  Object.entries(v).forEach(([k,val]) => r.style.setProperty(k, val));
  curTheme = t;
  localStorage.setItem('she-theme', t);
  ['dark','light','indigo'].forEach(x => {
    const el = document.getElementById('td' + x[0].toUpperCase() + x.slice(1));
    if (el) el.classList.toggle('on', x===t);
  });
}

/* ── role ─────────────────────────────────────── */
function setRole(r) {
  role = r;
  document.getElementById('btnT').classList.toggle('on', r==='teacher');
  document.getElementById('btnA').classList.toggle('on', r==='admin');
  const an = document.getElementById('adminNav');
  const tn = document.getElementById('teacherNav');
  an.style.display = r==='admin' ? 'block' : 'none';
  tn.style.display = r==='teacher' ? 'flex' : 'none';
  document.getElementById('ava').textContent   = r==='admin' ? '管' : '张';
  document.getElementById('uName').textContent = r==='admin' ? '管理员' : '张老师';
  document.getElementById('uRole').textContent = r==='admin' ? '系统管理员' : '教师';
  if (r==='teacher') { buildSteps(); renderTeacher(curStep); }
  else goAdmin(adminPage);
}

/* ── admin ────────────────────────────────────── */
function goAdmin(p) {
  adminPage = p;
  document.querySelectorAll('#adminNav .nav-item').forEach(el => el.classList.remove('on'));
  const idx = ['dashboard','tasks','users','projects','logs','config','rules'].indexOf(p);
  document.querySelectorAll('#adminNav .nav-item')[idx]?.classList.add('on');
  const labels = {dashboard:'数据看板',tasks:'任务队列',users:'用户管理',projects:'项目管理',logs:'系统日志',config:'LLM 配置',rules:'红线规则'};
  document.getElementById('bc').innerHTML = `<span>管理中心</span><span class="bc-sep">/</span><span class="bc-curr">${labels[p]}</span>`;
  const fns = {dashboard:vDashboard,tasks:vTasks,users:vUsers,projects:vProjects,logs:vLogs,config:vConfig,rules:vRules};
  document.getElementById('main').innerHTML = (fns[p] || vDashboard)();
}

/* status badge helper */
function badge(s) {
  const map = {run:['b-run','进行中',true], done:['b-ok','已完成',false], idle:['b-idle','等待中',false], err:['b-err','重试中',false]};
  const [cls,txt,blink] = map[s] || map.idle;
  return `<span class="badge ${cls}"><span class="bdot${blink?' blink':''}"></span>${txt}</span>`;
}

/* ── teacher views ────────────────────────────── */
function buildSteps() {
  document.getElementById('stepsList').innerHTML = STEPS.map(s=>`
  <div class="step-row ${s.id===curStep?'on':''}" onclick="goStep(${s.id})">
    <div class="step-node ${s.id===curStep&&s.state==='run'?'sn-run':s.id===curStep?'sn-active':s.state==='done'?'sn-done':'sn-idle'}">
      ${s.state==='done'?'✓':s.id}
    </div>
    <div><div class="s-name">${s.name}</div><div class="s-hint">${s.hint}</div></div>
  </div>`).join('');
}

function goStep(id) {
  curStep = id;
  buildSteps();
  renderTeacher(id);
}

function renderTeacher(id) {
  const fns = {1:vT1,2:vT2,3:vT3,4:vT4};
  document.getElementById('main').innerHTML = (fns[id]||vLocked)(id);
  document.getElementById('bc').innerHTML = `<span>小学数学 · 加法进位</span><span class="bc-sep">/</span><span class="bc-curr">${STEPS[id-1].name}</span>`;
}

function progBar(cur) {
  return STEPS.map(s=>`<div class="prog-seg ${s.id<cur?'done':s.id===cur?'active':''}"></div>`).join('');
}
