# 规则登记表索引
# 每条规则一个独立 YAML 文件，调度器按 trigger_node + trigger_event 索引取出
# 详细规则定义见 rules/R*.yaml；语义和分组说明见 rules.md

version: "1.0.0"
last_updated: "2026-06-19"

# 严重度
severity_levels:
  - hard_block    # 阻断 approve，无 override
  - warning       # 红字提示，允许 override（记入飞轮）
  - info          # 仅提示

# 执行器
executors:
  builtin:                                  # 内置 Python 检查函数
    type: function
    location: "engine/builtin_checks.py"
  agent:claude:                             # 调用 Claude 智能体
    type: llm_agent
    provider: claude
    prompt_template: "prompts/supervisor/page_reviewer.md"
  "script:final_delivery_gate.py":
    type: external_script
    location: "scripts/final_delivery_gate.py"
  "script:audit_student_visible_text.py":
    type: external_script
    location: "scripts/audit_student_visible_text.py"
  "script:audit_six_package_consistency.py":
    type: external_script
    location: "scripts/audit_six_package_consistency.py"
  "script:audit_delivery_contracts.py":
    type: external_script
    location: "scripts/audit_delivery_contracts.py"
  "script:workflow_enforcement_gate.py":
    type: external_script
    location: "scripts/workflow_enforcement_gate.py"
  "script:svg_quality_checker.py":
    type: external_script
    location: "ppt-master/svg_quality_checker.py"

