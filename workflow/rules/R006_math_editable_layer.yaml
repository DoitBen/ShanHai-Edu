rule_id: R006
title: 数学事实必须进可编辑文本层
trigger_node: ppt_page_script
trigger_event: on_approve_attempt
severity: hard_block
check:
  type: foreach_page
  expression: |
    FOR EACH page.math_assertions[*]:
      assertion.editable_layer IN ["ppt_text", "ppt_shape", "ppt_chart"]
action_message: 数学公式/数字/单位/答案不得交给图片或视频模型生成，必须进 PPT 可编辑文本层
executor: builtin
legacy_source: PPT探究型页面约束_工作流节点.md「准确性门禁」
